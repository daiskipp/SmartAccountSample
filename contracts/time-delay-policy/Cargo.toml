[package]
name = "time-delay-policy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=27.0.6"
stellar-accounts = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "fbfde38" }

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }

[profile.release]
overflow-checks = true
